<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sly Clicker - ALPHAZONK.FUN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0e15;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* FIXED HOME BUTTON FOR GITHUB PAGES */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            color: #ffffff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 1000;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* MAIN CARD CONTAINER */
        .clicker-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 40px;
            width: 380px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #ff2a5f;
            margin-bottom: 6px;
        }

        .score {
            font-size: 4rem;
            font-weight: 900;
            line-height: 1;
            margin: 15px 0 25px 0;
            letter-spacing: -1px;
        }

        .cps {
            font-size: 0.9rem;
            color: #888899;
            margin-top: -15px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* THE ORIGINAL FOX CLICK BUTTON */
        .fox-btn {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle, #ff2a5f 0%, #ff0040 100%);
            box-shadow: 0 0 40px rgba(255, 42, 95, 0.5);
            cursor: pointer;
            outline: none;
            font-size: 4.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            margin-bottom: 30px;
        }

        .fox-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 55px rgba(255, 42, 95, 0.7);
        }

        .fox-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 25px rgba(255, 42, 95, 0.8);
        }

        /* UPGRADES SECTION */
        .upgrades-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .upgrade-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upgrade-btn:hover:not(:disabled) {
            background: rgba(255, 42, 95, 0.15);
            border-color: rgba(255, 42, 95, 0.4);
        }

        .upgrade-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .cost-tag {
            color: #ff2a5f;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <!-- WORKING HOME LINK -->
    <a href="../" class="back-btn">← Home</a>

    <div class="clicker-card">
        <h1 class="title">SLY CLICKER</h1>
        <div class="score" id="score">0</div>
        <div class="cps" id="cps">0 sly / sec</div>

        <button class="fox-btn" id="foxBtn">🦊</button>

        <div class="upgrades-container">
            <button class="upgrade-btn" id="buyAuto" disabled>
                <span>Auto Clicker (+1/s)</span>
                <span class="cost-tag" id="autoCost">10 clicks</span>
            </button>
        </div>
    </div>

    <script>
        let clicks = 0;
        let autoClickers = 0;
        let autoCost = 10;

        const scoreEl = document.getElementById('score');
        const cpsEl = document.getElementById('cps');
        const foxBtn = document.getElementById('foxBtn');
        const buyAutoBtn = document.getElementById('buyAuto');
        const autoCostEl = document.getElementById('autoCost');

        foxBtn.addEventListener('click', () => {
            clicks++;
            updateDisplay();
        });

        buyAutoBtn.addEventListener('click', () => {
            if (clicks >= autoCost) {
                clicks -= autoCost;
                autoClickers++;
                autoCost = Math.floor(autoCost * 1.5);
                updateDisplay();
            }
        });

        setInterval(() => {
            if (autoClickers > 0) {
                clicks += autoClickers;
                updateDisplay();
            }
        }, 1000);

        function updateDisplay() {
            scoreEl.innerText = clicks.toLocaleString();
            cpsEl.innerText = `${autoClickers} sly / sec`;
            autoCostEl.innerText = `${autoCost.toLocaleString()} clicks`;
            buyAutoBtn.disabled = clicks < autoCost;
        }
    </script>
</body>
</html>
