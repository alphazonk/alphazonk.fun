<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sly Clicker - AlphaZonk.fun</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1c29 0%, #0e1017 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            user-select: none;
        }

        /* BACK TO HOME BUTTON */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #ffffff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 1000;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        /* CLICKER CONTAINER */
        .clicker-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff0055, #ff416c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-display {
            font-size: 3.5rem;
            font-weight: 800;
            margin: 20px 0;
            color: #ffffff;
        }

        .click-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff0055, #ff416c);
            color: white;
            font-size: 4rem;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.4);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            outline: none;
            margin-bottom: 25px;
        }

        .click-btn:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.6);
        }

        .upgrades {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .upgrade-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .upgrade-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.18);
        }

        .upgrade-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <!-- HOME BUTTON -->
    <a href="../" class="back-btn">← Home</a>

    <div class="clicker-container">
        <h1>SLY CLICKER</h1>
        <div class="score-display" id="score">0</div>
        
        <button class="click-btn" id="clicker">🦊</button>

        <div class="upgrades">
            <button class="upgrade-btn" id="buyAuto" disabled>
                <span>Auto Clicker (+1/s)</span>
                <span id="autoCost">10 clicks</span>
            </button>
        </div>
    </div>

    <script>
        let clicks = 0;
        let autoClickers = 0;
        let autoCost = 10;

        const scoreEl = document.getElementById('score');
        const clickerBtn = document.getElementById('clicker');
        const buyAutoBtn = document.getElementById('buyAuto');
        const autoCostEl = document.getElementById('autoCost');

        clickerBtn.addEventListener('click', () => {
            clicks++;
            updateDisplay();
        });

        buyAutoBtn.addEventListener('click', () => {
            if (clicks >= autoCost) {
                clicks -= autoCost;
                autoClickers++;
                autoCost = Math.floor(autoCost * 1.5);
                updateDisplay();
            }
        });

        setInterval(() => {
            if (autoClickers > 0) {
                clicks += autoClickers;
                updateDisplay();
            }
        }, 1000);

        function updateDisplay() {
            scoreEl.innerText = clicks;
            autoCostEl.innerText = `${autoCost} clicks`;
            buyAutoBtn.disabled = clicks < autoCost;
        }
    </script>
</body>
</html>
