<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sly Clicker - ALPHAZONK.FUN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f13;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* FIXED HOME BUTTON */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            color: #ffffff;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 22px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            z-index: 1000;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* MAIN GAME CONTAINER */
        .game-layout {
            display: flex;
            gap: 40px;
            max-width: 900px;
            width: 90%;
            align-items: center;
            z-index: 10;
        }

        /* LEFT SIDE - CLICKER AREA */
        .clicker-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .title {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ff0055, #ff416c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .score-box {
            margin: 15px 0 30px 0;
        }

        .score-count {
            font-size: 3.8rem;
            font-weight: 900;
            line-height: 1;
        }

        .cps-count {
            font-size: 1rem;
            color: #a0a0b0;
            margin-top: 6px;
            font-weight: 600;
        }

        /* SLY CLICK BUTTON */
        .sly-button-wrapper {
            position: relative;
        }

        .sly-btn {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff0055, #ff416c);
            box-shadow: 0 0 50px rgba(255, 0, 85, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .sly-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 65px rgba(255, 0, 85, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.4);
        }

        .sly-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.8);
        }

        /* FLOATING CLICK TEXT ANIMATION */
        .floating-text {
            position: absolute;
            font-weight: 900;
            font-size: 1.8rem;
            color: #ff416c;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
        }

        /* RIGHT SIDE - SHOP UPGRADES */
        .shop-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .shop-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            color: #e0e0e0;
        }

        .upgrade-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upgrade-card:hover:not(.disabled) {
            background: rgba(255, 65, 108, 0.15);
            border-color: rgba(255, 65, 108, 0.4);
            transform: translateX(4px);
        }

        .upgrade-card.disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .upgrade-info h4 {
            font-size: 1.05rem;
            font-weight: 800;
        }

        .upgrade-info p {
            font-size: 0.8rem;
            color: #999;
            margin-top: 2px;
        }

        .upgrade-cost {
            font-weight: 800;
            font-size: 1.05rem;
            color: #ff416c;
        }

        @media (max-width: 768px) {
            .game-layout {
                flex-direction: column;
                gap: 30px;
                padding-top: 60px;
            }

            .shop-section {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- WORKING HOME BUTTON -->
    <a href="../" class="back-btn">← Home</a>

    <div class="game-layout">
        
        <!-- CLICKER AREA -->
        <div class="clicker-section">
            <h1 class="title">SLY CLICKER</h1>
            
            <div class="score-box">
                <div class="score-count" id="score">0</div>
                <div class="cps-count" id="cps">per second: 0</div>
            </div>

            <div class="sly-button-wrapper">
                <button class="sly-btn" id="slyBtn">🦊</button>
            </div>
        </div>

        <!-- UPGRADES SHOP -->
        <div class="shop-section">
            <div class="shop-title">Upgrades & Boosts</div>

            <!-- Upgrade 1 -->
            <div class="upgrade-card disabled" id="upgClick">
                <div class="upgrade-info">
                    <h4>Sly Paw</h4>
                    <p>+1 Sly per click</p>
                </div>
                <div class="upgrade-cost" id="costClick">15</div>
            </div>

            <!-- Upgrade 2 -->
            <div class="upgrade-card disabled" id="upgAuto1">
                <div class="upgrade-info">
                    <h4>Auto-Sneak</h4>
                    <p>+1 Sly per sec</p>
                </div>
                <div class="upgrade-cost" id="costAuto1">50</div>
            </div>

            <!-- Upgrade 3 -->
            <div class="upgrade-card disabled" id="upgAuto2">
                <div class="upgrade-info">
                    <h4>Fox Den</h4>
                    <p>+8 Sly per sec</p>
                </div>
                <div class="upgrade-cost" id="costAuto2">250</div>
            </div>

            <!-- Upgrade 4 -->
            <div class="upgrade-card disabled" id="upgAuto3">
                <div class="upgrade-info">
                    <h4>Sly Empire</h4>
                    <p>+40 Sly per sec</p>
                </div>
                <div class="upgrade-cost" id="costAuto3">1,200</div>
            </div>
        </div>

    </div>

    <script>
        // GAME STATE
        let slyCount = 0;
        let clickPower = 1;
        let cps = 0;

        // UPGRADE COSTS & STATS
        const upgrades = {
            click: { cost: 15, power: 1, level: 0 },
            auto1: { cost: 50, cps: 1, level: 0 },
            auto2: { cost: 250, cps: 8, level: 0 },
            auto3: { cost: 1200, cps: 40, level: 0 }
        };

        // DOM ELEMENTS
        const scoreEl = document.getElementById('score');
        const cpsEl = document.getElementById('cps');
        const slyBtn = document.getElementById('slyBtn');

        const upgClick = document.getElementById('upgClick');
        const upgAuto1 = document.getElementById('upgAuto1');
        const upgAuto2 = document.getElementById('upgAuto2');
        const upgAuto3 = document.getElementById('upgAuto3');

        // CLICK HANDLER WITH FLOATING NUMBERS
        slyBtn.addEventListener('click', (e) => {
            slyCount += clickPower;
            spawnFloatingText(e, `+${clickPower}`);
            updateDisplay();
        });

        function spawnFloatingText(e, text) {
            const floatEl = document.createElement('div');
            floatEl.className = 'floating-text';
            floatEl.innerText = text;

            // Position near click target
            const rect = slyBtn.getBoundingClientRect();
            const x = e.clientX ? e.clientX - rect.left - 20 : rect.width / 2;
            const y = e.clientY ? e.clientY - rect.top - 20 : rect.height / 2;

            floatEl.style.left = `${rect.left + x}px`;
            floatEl.style.top = `${rect.top + y}px`;

            document.body.appendChild(floatEl);

            setTimeout(() => floatEl.remove(), 800);
        }

        // UPGRADE BUY LOGIC
        upgClick.addEventListener('click', () => buyUpgrade('click', () => {
            clickPower += 1;
        }));

        upgAuto1.addEventListener('click', () => buyUpgrade('auto1', () => {
            cps += upgrades.auto1.cps;
        }));

        upgAuto2.addEventListener('click', () => buyUpgrade('auto2', () => {
            cps += upgrades.auto2.cps;
        }));

        upgAuto3.addEventListener('click', () => buyUpgrade('auto3', () => {
            cps += upgrades.auto3.cps;
        }));

        function buyUpgrade(key, applyEffect) {
            const item = upgrades[key];
            if (slyCount >= item.cost) {
                slyCount -= item.cost;
                item.level++;
                applyEffect();
                item.cost = Math.floor(item.cost * 1.6);
                updateDisplay();
            }
        }

        // AUTO CPS TICKER
        setInterval(() => {
            if (cps > 0) {
                slyCount += cps;
                updateDisplay();
            }
        }, 1000);

        // UI UPDATE LOOP
        function updateDisplay() {
            scoreEl.innerText = Math.floor(slyCount).toLocaleString();
            cpsEl.innerText = `per second: ${cps.toLocaleString()}`;

            // Update Costs
            document.getElementById('costClick').innerText = upgrades.click.cost.toLocaleString();
            document.getElementById('costAuto1').innerText = upgrades.auto1.cost.toLocaleString();
            document.getElementById('costAuto2').innerText = upgrades.auto2.cost.toLocaleString();
            document.getElementById('costAuto3').innerText = upgrades.auto3.cost.toLocaleString();

            // Toggle Card State
            toggleCard(upgClick, upgrades.click.cost);
            toggleCard(upgAuto1, upgrades.auto1.cost);
            toggleCard(upgAuto2, upgrades.auto2.cost);
            toggleCard(upgAuto3, upgrades.auto3.cost);
        }

        function toggleCard(el, cost) {
            if (slyCount >= cost) {
                el.classList.remove('disabled');
            } else {
                el.classList.add('disabled');
            }
        }

        updateDisplay();
    </script>
</body>
</html>
